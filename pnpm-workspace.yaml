# Migrado desde el campo `pnpm` de package.json, que pnpm 11 ya no lee.
# Se autoriza exactamente lo que estaba autorizado antes: ni un paquete más.
allowBuilds:
  unrs-resolver: true
  # No estaba en la config previa, así que se deniega.
  esbuild: false
  # Autorizado por Néstor el 24-10-2026 (docs/spec-pendientes/orquestacion-f2.md):
  # sharp es el decodificador de U-DAT-10 (firma, decodificación real con
  # limitInputPixels y reencodificación a WebP sin metadatos) y vuelve a dejar
  # disponible la optimización de next/image. Sigue bajo el override de
  # seguridad `>=0.35.5` de abajo; no autoriza ningún otro paquete.
  sharp: true
  # Supabase CLI fijada (U-INF-01). La 2.117.0 resuelve el binario mediante
  # dependencias opcionales por plataforma; se autoriza por si una versión
  # fijada posterior vuelve a descargarlo en su script de instalación.
  supabase: true

# Overrides de dependencias transitivas con avisos de seguridad. Todos son
# saltos dentro del mismo major: sólo suben el paquete vulnerable, sin
# arrastrar la cadena. Se revisan cuando el padre los suba por su cuenta.
overrides:
  postcss: '>=8.5.25'
  sharp: '>=0.35.5'
  nanoid: '>=3.3.18 <4'
  source-map-js: '>=1.2.2'
